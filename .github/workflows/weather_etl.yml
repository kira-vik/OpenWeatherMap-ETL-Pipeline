name: Weather ETL Pipeline
on:
  schedule:
    - cron: "0 * * * *" # Runs hourly (UTC)
  workflow_dispatch:

jobs:
  weather_etl:
    name: Run Weather ETL Pipeline
    runs-on: ubuntu-latest

    env:
      OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PYTHONUNBUFFERED: 1 # Ensures real-time logging

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the ETL script
      - name: Run ETL Script
        run: |
          echo "Starting Weather ETL Process at $(date)"
          python app.py

      # Step 5: Verify ETL run success
      - name: Verify ETL Run
        run: |
          if [ $? -eq 0 ]; then
               echo "Weather ETL Process completed successfully at $(date)"
          else
               echo "Weather ETL Process failed at $(date)"
               cat logs/weather_etl.log || echo "No log file found."
               exit 1
          fi
